<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Survey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#3B57B8;
    --blue-dark:#2A3F8C;
    --sage:#6B7A3E;
    --rust:#B5583F;
    --cream:#FAF8F4;
    --ink:#1E2233;
    --ink-soft:#5B5F6E;
    --line:#E4E1D8;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',sans-serif;
    background:var(--cream);
    color:var(--ink);
    min-height:100vh;
  }
  .shell{
    max-width:640px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding:0 24px;
  }
  header.top{
    padding:24px 0 12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .logo{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:18px;
    color:var(--blue);
    letter-spacing:-0.01em;
  }
  .eyebrow{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:12px;
    letter-spacing:.06em;
    color:var(--ink-soft);
  }
  .progress-wrap{
    display:flex;
    align-items:center;
    gap:10px;
    padding-bottom:12px;
  }
  .progress-track{
    flex:1;
    height:4px;
    background:var(--line);
    border-radius:4px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:var(--blue);
    width:0%;
    transition:width .35s ease;
  }
  .progress-label{
    font-size:12px;
    color:var(--ink-soft);
    font-variant-numeric:tabular-nums;
    min-width:36px;
    text-align:right;
  }
  main{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:32px 0 40px;
  }
  .section-tag{
    font-size:12px;
    font-weight:600;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--sage);
    margin-bottom:14px;
  }
  h1.q-title{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:26px;
    line-height:1.35;
    margin:0 0 8px;
    color:var(--ink);
  }
  p.q-sub{
    font-size:14px;
    color:var(--ink-soft);
    margin:0 0 24px;
    line-height:1.6;
  }
  .info-block{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:14px;
    padding:20px;
    margin-bottom:24px;
  }
  .info-item{
    display:flex;
    gap:12px;
    padding:10px 0;
    border-bottom:1px solid var(--line);
    font-size:14px;
    line-height:1.5;
  }
  .info-item:last-child{border-bottom:none;}
  .info-item b{color:var(--blue);min-width:88px;flex-shrink:0;}
  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 16px;
    border:1.5px solid var(--line);
    border-radius:12px;
    background:var(--white);
    cursor:pointer;
    font-size:15px;
    transition:border-color .15s, background .15s;
    user-select:none;
  }
  .opt:hover{border-color:var(--blue);}
  .opt.selected{
    border-color:var(--blue);
    background:#EEF1FB;
  }
  .opt .mark{
    width:18px;height:18px;
    border-radius:50%;
    border:1.5px solid var(--line);
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
  }
  .opt.multi .mark{border-radius:5px;}
  .opt.selected .mark{border-color:var(--blue);background:var(--blue);}
  .opt.selected .mark::after{
    content:'';
    width:8px;height:8px;
    border-radius:50%;
    background:var(--white);
  }
  .opt.multi.selected .mark::after{
    width:9px;height:6px;
    border-radius:0;
    border-left:2px solid var(--white);
    border-bottom:2px solid var(--white);
    background:none;
    transform:rotate(-45deg) translate(1px,-1px);
  }
  .other-input{
    margin-top:8px;
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--line);
    border-radius:10px;
    font-family:'Inter',sans-serif;
    font-size:14px;
  }
  input[type=text], input[type=number], textarea{
    width:100%;
    padding:14px 16px;
    border:1.5px solid var(--line);
    border-radius:12px;
    font-family:'Inter',sans-serif;
    font-size:15px;
    background:var(--white);
  }
  textarea{min-height:110px;resize:vertical;font-family:'Inter',sans-serif;}
  input:focus, textarea:focus{outline:none;border-color:var(--blue);}
  .scale-row{
    display:flex;
    gap:8px;
    margin-top:6px;
  }
  .scale-btn{
    flex:1;
    aspect-ratio:1;
    border:1.5px solid var(--line);
    border-radius:12px;
    background:var(--white);
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:18px;
    cursor:pointer;
    color:var(--ink-soft);
  }
  .scale-btn.selected{
    border-color:var(--blue);
    background:var(--blue);
    color:var(--white);
  }
  .scale-labels{
    display:flex;
    justify-content:space-between;
    font-size:11px;
    color:var(--ink-soft);
    margin-top:8px;
  }
  .hint{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:6px;
  }
  footer.nav{
    position:sticky;
    bottom:0;
    background:var(--cream);
    padding:10px 0 28px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  button.nav-btn{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:15px;
    padding:14px 22px;
    border-radius:12px;
    border:none;
    cursor:pointer;
  }
  button.back{
    background:transparent;
    color:var(--ink-soft);
    border:1.5px solid var(--line);
  }
  button.forward{
    background:var(--blue);
    color:var(--white);
    flex:1;
  }
  button.forward:disabled{
    background:#C7CBDD;
    cursor:not-allowed;
  }
  button.forward:hover:not(:disabled){background:var(--blue-dark);}
  .lang-screen{
    min-height:70vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
  }
  .greeting{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:44px;
    color:var(--ink);
    opacity:1;
    transition:opacity .4s ease;
    margin-bottom:36px;
    min-height:56px;
  }
  .lang-select-label{
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:18px;
    letter-spacing:.02em;
  }
  .lang-buttons{
    display:flex;
    gap:12px;
  }
  .lang-btn{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:15px;
    padding:14px 28px;
    border-radius:12px;
    border:1.5px solid var(--line);
    background:var(--white);
    color:var(--ink);
    cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .lang-btn:hover{
    border-color:var(--blue);
    background:#EEF1FB;
  }
  .done-screen{
    text-align:center;
    padding:60px 0;
  }
  .done-screen .icon{
    font-size:48px;
    margin-bottom:16px;
  }
  .done-screen h1{
    font-family:'Fraunces',serif;
    font-size:26px;
    margin-bottom:10px;
  }
  .done-screen p{
    color:var(--ink-soft);
    font-size:14px;
    line-height:1.6;
  }
  .error-msg{
    color:var(--rust);
    font-size:13px;
    margin-top:14px;
  }
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <span class="logo">User Survey</span>
    <span class="eyebrow">IEB 2026</span>
  </header>
  <div class="progress-wrap" id="progressBar" style="display:none;">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <span class="progress-label" id="progressLabel">0%</span>
  </div>
  <main id="main"></main>
</div>

<script>
/* ============ CONFIG ============ */
// Google Apps Script Web App URL — deploy the companion script and paste the /exec URL here.
const SUBMIT_URL = "https://script.google.com/macros/s/AKfycbyl6jYJlBSoWWXqSpGhnm9FKyZ6IV5CUVmg2f7TvmTK-DSEpSjcyF6c1WUWCFQUYplaDg/exec";

/* ============ I18N HELPERS ============ */
function isEN(a){ return a && a.country === 'English (CAD)'; }
function L(a, kr, en){ return isEN(a) ? en : kr; }
function LA(a, krArr, enArr){ return isEN(a) ? enArr : krArr; }

/* ============ SHARED OPTION SETS ============ */
const FACTORS_KR = ["성격","품종","크기","활동량·에너지 레벨","털 관리 난이도","알레르기 여부","훈련 난이도","주거 형태와의 적합성","예산(초기 비용+월 유지비)","가족 구성원과의 적합성(아이/노인/기존 반려동물 등)","본인이 직접 고려하지 않음 (가족 등 다른 사람이 결정)","기타"];
const FACTORS_EN = ["Personality","Breed","Size","Activity/energy level","Grooming difficulty","Allergies","Trainability","Fit with housing type","Budget (initial cost + monthly upkeep)","Fit with family members (children, elderly, existing pets, etc.)","I wasn't the one who considered this (a family member or someone else decided)","Other"];
const FACTORS = (a)=> LA(a, FACTORS_KR, FACTORS_EN);

const ACQUIRE_KR = ["보호소","브리더","펫샵","지인","직접 구조","온라인 입양 플랫폼","기타"];
const ACQUIRE_EN = ["Animal shelter","Breeder","Pet store","Friend or family","Rescued it myself","Online adoption platform","Other"];
const ACQUIRE = (a)=> LA(a, ACQUIRE_KR, ACQUIRE_EN);

const DEVICE_TYPES_KR = ["스마트/자동 급식기 (정해진 시간·양에 자동 급여)","반려동물 카메라/펫캠 (실시간 확인, 이상행동 알림)","스마트 목걸이 (위치·활동량·심박수 등 건강 데이터 트래킹)","스마트 정수기 (수분 섭취 감지, 자동 급수)","자동 화장실 (배변 자동 처리 및 기록)","스마트 체중계 (체중 변화 자동 측정·기록)","스마트 펫도어 (반려동물 출입 자동 인식)","기타"];
const DEVICE_TYPES_EN = ["Smart/automatic feeder (dispenses food on a schedule)","Pet camera (real-time check-ins, unusual-behavior alerts)","Smart collar (tracks location, activity, and health data)","Smart water fountain (detects intake, auto-refills)","Automatic litter box (handles and logs waste automatically)","Smart pet scale (automatically tracks weight over time)","Smart pet door (automatically recognizes and opens for your pet)","Other"];
const DEVICE_TYPES = (a)=> LA(a, DEVICE_TYPES_KR, DEVICE_TYPES_EN);

const NOUSE_REASONS_KR = ["너무 비쌀 것 같음","필요성을 못 느낌","기술에 익숙하지 않음","어떤 게 유용할지 모름","개인정보 우려","정확성을 신뢰 못함","설정·사용이 어려워 보임","전통적인 방식 선호","구독료 부담","기타"];
const NOUSE_REASONS_EN = ["Seems too expensive","Don't feel the need for one","Not familiar with the technology","Not sure which one would be useful","Privacy concerns","Don't trust the accuracy","Setup/use seems difficult","Prefer traditional methods","Subscription fees are a burden","Other"];
const NOUSE_REASONS = (a)=> LA(a, NOUSE_REASONS_KR, NOUSE_REASONS_EN);

const LIMIT_REASONS_KR = ["너무 비쌈","설정·사용이 어려움","데이터가 유용하지 않음","기기 간 연동 안 됨","앱이 너무 많음","추천이 일반적임","정확도·신뢰성 문제","개인정보 우려","유지관리 번거로움","구독료 부담","사용 안 함(필요성 못 느낌)","만족하며 불만 없음","기타"];
const LIMIT_REASONS_EN = ["Too expensive","Difficult to set up or use","Data isn't very useful","Devices don't integrate well","Too many separate apps","Recommendations are too generic","Accuracy/reliability issues","Privacy concerns","Maintenance is a hassle","Subscription fees are a burden","Don't use one (don't feel the need)","Satisfied, no major complaints","Other"];
const LIMIT_REASONS = (a)=> LA(a, LIMIT_REASONS_KR, LIMIT_REASONS_EN);

const TOP_FEATURES_KR = ["활동·행동 모니터링","식사·수분 섭취 모니터링","체중 및 건강 트래킹","건강 관련 알림","AI 기반 맞춤형 케어 추천","여러 스마트기기를 하나의 앱에서 통합 관리","초보 반려인을 위한 가이드","신뢰할 수 있는 반려동물 케어 정보·자료 제공","기타"];
const TOP_FEATURES_EN = ["Activity/behavior monitoring","Feeding/hydration monitoring","Weight and wellness tracking","Health-related alerts","AI-powered personalized care recommendations","Managing multiple smart devices in one app","Guidance for new pet owners","Access to trusted pet care information","Other"];
const TOP_FEATURES = (a)=> LA(a, TOP_FEATURES_KR, TOP_FEATURES_EN);

const MATCH_INPUTS_KR = ["주거환경","활동량","예산","알레르기","가족 구성원","그루밍(털 관리 등)에 할애 가능한 시간","성격 선호","기타"];
const MATCH_INPUTS_EN = ["Living environment","Activity level","Budget","Allergies","Family members","Time available for grooming","Personality preference","Other"];
const MATCH_INPUTS = (a)=> LA(a, MATCH_INPUTS_KR, MATCH_INPUTS_EN);

const DEVICE_INFO_KR = [
  ["스마트 급식기","정해진 시간과 양에 맞춰 자동으로 사료를 급여하는 기기"],
  ["반려동물 카메라","외출 중에도 반려동물의 모습을 실시간으로 확인할 수 있는 카메라"],
  ["스마트 체중계","반려동물의 체중 변화를 자동으로 측정하고 기록하는 저울"],
  ["스마트 목걸이","위치·활동량·심박수 등 건강 데이터를 기록하는 웨어러블 기기"],
  ["스마트 정수기","수분 섭취량을 감지하고 신선한 물을 자동 공급하는 급수기"]
];
const DEVICE_INFO_EN = [
  ["Smart feeder","Automatically dispenses food at set times and amounts"],
  ["Pet camera","Lets you check in on your pet in real time while you're away"],
  ["Smart pet scale","Automatically measures and logs your pet's weight over time"],
  ["Smart collar","A wearable that tracks location, activity, and health data like heart rate"],
  ["Smart water fountain","Detects water intake and automatically supplies fresh water"]
];
const DEVICE_INFO = (a)=> LA(a, DEVICE_INFO_KR, DEVICE_INFO_EN);

/* ============ STEP DEFINITIONS ============ */
// type: info | text | number | single | multi | scale | divider
// groups: 'all' or array of ['current','past','first']
// showIf: function(a) => bool
const steps = [
  {id:'nationality', section:(a)=>L(a,'Section 1 · 기본 정보','Section 1 · Basic Information'), type:'single', title:(a)=>L(a,'국적을 알려주세요.','What is your nationality?'),
    options:(a)=> LA(a, ['대한민국','캐나다','기타'], ['South Korea','Canada','Other']), groups:'all'},
  {id:'age', section:(a)=>L(a,'Section 1 · 기본 정보','Section 1 · Basic Information'), type:'number', title:(a)=>L(a,'만 나이를 입력해주세요.','What is your age?'), groups:'all'},
  {id:'household', section:(a)=>L(a,'Section 1 · 기본 정보','Section 1 · Basic Information'), type:'multi', title:(a)=>L(a,'현재 귀하와 함께 거주하는 사람을 모두 선택해 주세요.','Please select everyone you currently live with.'),
    sub:(a)=>L(a,'본인을 제외하고 선택해 주세요.','Please select excluding yourself.'),
    options:(a)=> LA(a, ['혼자 거주함','배우자 또는 파트너','자녀','부모 또는 배우자의 부모','형제·자매','조부모','기타 친척','친구 또는 룸메이트','기타 비가족 구성원','기타','응답하고 싶지 않음'], ['Living alone','Spouse or partner','Children','Parents or parents-in-law','Siblings','Grandparents','Other relatives','Friends or roommates','Other non-family members','Other','Prefer not to answer']),
    groups:'all'},
  {id:'housing', section:(a)=>L(a,'Section 1 · 기본 정보','Section 1 · Basic Information'), type:'single', title:(a)=>L(a,'현재 거주 형태는 무엇인가요?','What type of home do you currently live in?'),
    options:(a)=> LA(a, ['아파트/오피스텔','주택','기타'], ['Condo/Apartment','House','Other']),
    groups:'all'},
  {id:'ownership', section:(a)=>L(a,'Section 1 · 기본 정보','Section 1 · Basic Information'), type:'single', title:(a)=>L(a,'현재 거주지 소유 형태는 무엇인가요?','What is your housing ownership status?'),
    options:(a)=> LA(a, ['본인 소유','임차 (전세/월세)','부모님·가족 명의 주택에 거주 (무상)','기타'], ['I own it','I rent it','Living in a family member\'s home (no rent)','Other']),
    groups:'all'},

  {id:'route_current', section:(a)=>L(a,'Section 2 · 반려동물 양육 경험','Section 2 · Pet Ownership Experience'), type:'single', title:(a)=>L(a,'현재 반려동물을 키우고 있나요?','Do you currently own a pet?'),
    options:(a)=> LA(a, ['예, 키우고 있어요','아니오'], ['Yes, I currently own a pet','No']), groups:'all'},
  {id:'route_past', section:(a)=>L(a,'Section 2 · 반려동물 양육 경험','Section 2 · Pet Ownership Experience'), type:'single', title:(a)=>L(a,'반려동물을 키워보신 적이 있나요?','Have you owned a pet before?'),
    options:(a)=> LA(a, ['예, 키운 적 있어요','아니오, 키운 적 없어요'], ['Yes, I have before','No, never']),
    groups:'all', showIf:(a)=> a.route_current==='아니오' || a.route_current==='No'},

  // ---- Section 2 : current + past merged ----
  {id:'pet_type', section:(a)=>L(a,'Section 3 · 반려동물 입양 경험','Section 3 · Pet Adoption Experience'), type:'multi',
    title:(a)=> a.__group==='past' ? L(a,'키워보신 반려동물의 종류를 모두 선택해주세요.','Select all the types of pets you owned before.') : L(a,'현재 키우고 있는 반려동물 종류를 모두 선택해주세요.','Select all the types of pets you currently own.'),
    options:(a)=> LA(a, ['강아지/개','고양이','기타'], ['Dog','Cat','Other']), groups:['current','past']},

/* ============ ENGINE ============ */
const answers = {};
let path = []; // resolved step objects in visit order
let cursor = 0;
let phase = 'lang'; // 'lang' -> 'onboarding' -> 'survey'
let greetingTimer = null;

const GREETINGS = ['안녕하세요','Hello'];

function renderLangSelect(){
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="lang-screen">
      <div class="greeting" id="greetingText">${GREETINGS[0]}</div>
      <div class="lang-select-label">언어를 선택하세요 · Select your language</div>
      <div class="lang-buttons">
        <button class="lang-btn" data-lang="한국어 (KOR)">한국어</button>
        <button class="lang-btn" data-lang="English (CAD)">English</button>
      </div>
    </div>`;
  let footer = document.querySelector('footer.nav');
  if(footer) footer.remove();

  let gi = 0;
  clearInterval(greetingTimer);
  greetingTimer = setInterval(()=>{
    const el = document.getElementById('greetingText');
    if(!el){ clearInterval(greetingTimer); return; }
    el.style.opacity = 0;
    setTimeout(()=>{
      gi = (gi + 1) % GREETINGS.length;
      el.textContent = GREETINGS[gi];
      el.style.opacity = 1;
    }, 400);
  }, 1600);

  document.querySelectorAll('.lang-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      clearInterval(greetingTimer);
      answers.country = btn.dataset.lang;
      phase = 'onboarding';
      render();
    });
  });
}

function renderOnboarding(){
  const isEn = answers.country === 'English (CAD)';
  const main = document.getElementById('main');
  main.innerHTML = isEn ? `
    <div class="section-tag">About this survey</div>
    <h1 class="q-title">Before you begin</h1>
    <p class="q-sub" style="margin-bottom:20px;">
      We're Cash Cow, a team participating in the IEB 2026 program (SKKU–UofT International Entrepreneurship Bootcamp). We're planning a pet care application, and this survey is conducted to understand how people care for pets, their experience with adoption, and what they expect from a pet care app.
    </p>
    <div class="info-block">
      <div class="info-item"><b>Time required</b><span>Approximately 5–7 minutes.</span></div>
      <div class="info-item"><b>Data use</b><span>Responses are used only for this team's application planning and program deliverables (IEB 2026), and are not shared outside the team or used for any other purpose.</span></div>
    </div>
  ` : `
    <div class="section-tag">설문에 대하여</div>
    <h1 class="q-title">설문을 시작하기 전에</h1>
    <p class="q-sub" style="margin-bottom:20px;">
      저희는 IEB 2026 프로그램(성균관대-토론토대 국제 창업 부트캠프) 참가팀 Cash Cow입니다. 현재 반려동물 입양과 케어를 지원하는 어플리케이션을 기획 중에 있으며, 이에 반려동물과 관련된 전반적인 사용자 경험을 파악하고자 본 설문을 진행하게 되었습니다.
    </p>
    <div class="info-block">
      <div class="info-item"><b>소요 시간</b><span>약 5~7분이 소요됩니다.</span></div>
      <div class="info-item"><b>데이터 사용</b><span>수집된 응답은 본 팀의 어플리케이션 기획 및 IEB 2026 프로그램 산출물 제작 목적으로만 사용되며, 팀 외부에는 공유되지 않습니다.</span></div>
    </div>
  `;
  let footer = document.querySelector('footer.nav');
  if(footer) footer.remove();
  footer = document.createElement('footer');
  footer.className = 'nav';
  const fwdBtn = document.createElement('button');
  fwdBtn.className = 'nav-btn forward';
  fwdBtn.textContent = isEn ? 'Start the survey' : '설문 시작하기';
  fwdBtn.addEventListener('click', ()=>{ phase = 'survey'; render(); });
  footer.appendChild(fwdBtn);
  document.querySelector('.shell').appendChild(footer);
}


function currentGroup(){
  if(answers.route_current === '예, 키우고 있어요') return 'current';
  if(answers.route_past === '예, 키운 적 있어요') return 'past';
  if(answers.route_past === '아니오, 키운 적 없어요') return 'first';
  return null;
}

function stepApplies(s){
  const g = answers.__group;
  if(s.groups !== 'all' && (!g || !s.groups.includes(g))) return false;
  if(s.showIf && !s.showIf(answers)) return false;
  return true;
}

const SECTION_DIVIDERS = {
  1: {kr:'다음은 응답자 기본 정보에 대한 질문입니다.', en:'The following questions are about your basic information.'},
  2: {kr:'다음은 반려동물 양육 경험에 대한 질문입니다.', en:'The following questions are about your pet ownership experience.'},
  3: {kr:'다음은 반려동물 입양과 관련된 질문입니다.', en:'The following questions are about pet adoption.'},
  5: {kr:'다음은 나에게 맞는 반려동물을 추천해주는 기능에 대한 질문입니다.', en:'The following questions are about a feature that recommends pets tailored to you.'}
};

function sectionNum(sectionLabel){
  const m = /Section\s*(\d+)/.exec(sectionLabel);
  return m ? parseInt(m[1], 10) : null;
}

function buildPath(){
  // walk steps in order, filtering; group gets resolved as soon as routing answers exist
  answers.__group = currentGroup();
  const filtered = steps.filter(stepApplies);
  const withDividers = [];
  let prevNum = null;
  filtered.forEach(s=>{
    const label = typeof s.section === 'function' ? s.section(answers) : s.section;
    const num = sectionNum(label);
    if(num !== prevNum && SECTION_DIVIDERS[num]){
      withDividers.push({type:'divider', section:s.section, dividerText:SECTION_DIVIDERS[num]});
    }
    withDividers.push(s);
    prevNum = num;
  });
  path = withDividers;
}

function questionNumber(uptoIdx){
  let n = 0;
  for(let i=0; i<=uptoIdx; i++){
    if(!['info','divider'].includes(path[i].type)) n++;
  }
  return n;
}

function render(){
  if(phase === 'lang'){ document.getElementById('progressBar').style.display='none'; renderLangSelect(); return; }
  if(phase === 'onboarding'){ document.getElementById('progressBar').style.display='none'; renderOnboarding(); return; }
  document.getElementById('progressBar').style.display='flex';
  buildPath();
  if(cursor >= path.length){ renderDone(); return; }
  const s = path[cursor];
  const main = document.getElementById('main');
  const title = typeof s.title === 'function' ? s.title(answers) : s.title;
  const opts = typeof s.options === 'function' ? s.options(answers) : s.options;
  const sectionLabel = typeof s.section === 'function' ? s.section(answers) : s.section;
  const subText = typeof s.sub === 'function' ? s.sub(answers) : s.sub;

  const isQuestion = !['info','divider'].includes(s.type);
  const displayTitle = s.type === 'divider'
    ? (isEN(answers) ? s.dividerText.en : s.dividerText.kr)
    : title;
  const numPrefix = isQuestion ? `${questionNumber(cursor)}. ` : '';

  let html = `<div class="section-tag">${sectionLabel}</div><h1 class="q-title">${numPrefix}${displayTitle}</h1>`;
  if(s.type !== 'divider' && subText) html += `<p class="q-sub">${subText}</p>`;

  if(s.type === 'info'){
    html += `<div class="info-block">`;
    const body = typeof s.body === 'function' ? s.body(answers) : s.body;
    body.forEach(([k,v])=>{ html += `<div class="info-item"><b>${k}</b><span>${v}</span></div>`; });
    html += `</div>`;
  } else if(s.type === 'single'){
    html += `<div class="options">` + opts.map(o=>{
      const sel = answers[s.id] === o ? 'selected' : '';
      return `<div class="opt ${sel}" data-val="${escapeAttr(o)}"><span class="mark"></span>${o}</div>`;
    }).join('') + `</div>`;
    if(opts.some(isOtherVal) && isOtherVal(answers[s.id])){
      html += `<input type="text" id="otherInput" class="other-input" placeholder="${L(answers, '직접 입력해주세요', 'Please specify')}" value="${escapeAttr(answers[s.id+'_other']||'')}" style="margin-top:12px;">`;
    }
  } else if(s.type === 'multi'){
    const cur = answers[s.id] || [];
    html += `<div class="options">` + opts.map(o=>{
      const sel = cur.includes(o) ? 'selected' : '';
      return `<div class="opt multi ${sel}" data-val="${escapeAttr(o)}"><span class="mark"></span>${o}</div>`;
    }).join('') + `</div>`;
    if(s.max) html += `<p class="hint">${L(answers, `최대 ${s.max}개 선택`, `Select up to ${s.max}`)}</p>`;
    else html += `<p class="hint">${L(answers, '복수 선택 가능', 'You can select multiple options')}</p>`;
    if(opts.some(isOtherVal) && cur.some(isOtherVal)){
      html += `<input type="text" id="otherInput" class="other-input" placeholder="${L(answers, '직접 입력해주세요', 'Please specify')}" value="${escapeAttr(answers[s.id+'_other']||'')}" style="margin-top:12px;">`;
    }
  } else if(s.type === 'countByType'){
    const types = answers.pet_type || [];
    const cur = answers[s.id] || {};
    html += `<div class="options">` + types.map(t=>{
      const v = cur[t] !== undefined ? cur[t] : '';
      return `<div class="opt" style="cursor:default;justify-content:space-between;">
        <span>${t}</span>
        <input type="number" min="0" class="other-input count-inp" data-type="${escapeAttr(t)}" style="margin:0;width:90px;" value="${escapeAttr(v)}" placeholder="${L(answers, '마리 수', 'count')}">
      </div>`;
    }).join('') + `</div>`;
  } else if(s.type === 'text'){
    const val = answers[s.id] || '';
    html += s.textarea
      ? `<textarea id="inp">${escapeHtml(val)}</textarea>`
      : `<input type="text" id="inp" value="${escapeAttr(val)}">`;
    if(s.optional) html += `<p class="hint">${L(answers, '선택 응답 (비워두고 넘어가도 됩니다)', 'Optional (you can leave this blank)')}</p>`;
  } else if(s.type === 'number'){
    const val = answers[s.id] || '';
    html += `<input type="number" id="inp" value="${escapeAttr(val)}">`;
  } else if(s.type === 'scale'){
    const cur = answers[s.id];
    html += `<div class="scale-row">` + [1,2,3,4,5].map(n=>{
      const sel = cur === n ? 'selected' : '';
      return `<button type="button" class="scale-btn ${sel}" data-val="${n}">${n}</button>`;
    }).join('') + `</div>`;
    const lowText = typeof s.low === 'function' ? s.low(answers) : s.low;
    const highText = typeof s.high === 'function' ? s.high(answers) : s.high;
    html += `<div class="scale-labels"><span>${lowText}</span><span>${highText}</span></div>`;
  }

  html += `<div id="errBox"></div>`;
  main.innerHTML = html;

  attachHandlers(s);
  renderFooter(s);
  updateProgress();
}

function attachHandlers(s){
  if(s.type === 'single'){
    document.querySelectorAll('.opt').forEach(el=>{
      el.addEventListener('click', ()=>{
        answers[s.id] = el.dataset.val;
        if(isOtherVal(el.dataset.val)){ render(); }
        else{ goNext(); }
      });
    });
  } else if(s.type === 'multi'){
    document.querySelectorAll('.opt').forEach(el=>{
      el.addEventListener('click', ()=>{
        const cur = answers[s.id] || [];
        const v = el.dataset.val;
        const idx = cur.indexOf(v);
        if(idx >= 0){ cur.splice(idx,1); }
        else{
          if(s.max && cur.length >= s.max){ return; }
          cur.push(v);
        }
        answers[s.id] = cur;
        render();
      });
    });
  } else if(s.type === 'scale'){
    document.querySelectorAll('.scale-btn').forEach(el=>{
      el.addEventListener('click', ()=>{
        answers[s.id] = parseInt(el.dataset.val, 10);
        goNext();
      });
    });
  }
}

function renderFooter(s){
  let footer = document.querySelector('footer.nav');
  if(footer) footer.remove();
  footer = document.createElement('footer');
  footer.className = 'nav';

  const btnRow = document.createElement('div');
  btnRow.style.display = 'flex';
  btnRow.style.gap = '10px';

  const backBtn = document.createElement('button');
  backBtn.className = 'nav-btn back';
  backBtn.textContent = L(answers, '이전', 'Back');
  backBtn.disabled = cursor === 0;
  backBtn.style.visibility = cursor === 0 ? 'hidden' : 'visible';
  backBtn.addEventListener('click', goBack);

  const fwdBtn = document.createElement('button');
  fwdBtn.className = 'nav-btn forward';
  fwdBtn.textContent = L(answers, '다음', 'Next');

  if(s.type === 'scale'){
    fwdBtn.style.display = 'none'; // auto-advance
  } else if(s.type === 'single'){
    const opts = typeof s.options === 'function' ? s.options(answers) : s.options;
    const pendingOther = isOtherVal(answers[s.id]) && opts.some(isOtherVal);
    fwdBtn.style.display = pendingOther ? 'inline-block' : 'none';
  }
  fwdBtn.addEventListener('click', ()=> tryAdvance(s));

  btnRow.appendChild(backBtn);
  btnRow.appendChild(fwdBtn);
  footer.appendChild(btnRow);
  document.querySelector('.shell').appendChild(footer);
}

function isOtherVal(v){ return v === '기타' || v === 'Other'; }

function tryAdvance(s){
  const opts = typeof s.options === 'function' ? s.options(answers) : s.options;
  if(s.type === 'countByType'){
    const inputs = document.querySelectorAll('.count-inp');
    const result = {};
    let missing = false;
    inputs.forEach(el=>{
      const v = el.value.trim();
      if(v === ''){ missing = true; }
      result[el.dataset.type] = v;
    });
    if(missing){ showError(L(answers, '모든 종류의 마리 수를 입력해주세요.', 'Please enter a count for every type.')); return; }
    answers[s.id] = result;
  } else if(s.type === 'text'){
    const v = document.getElementById('inp').value.trim();
    if(!s.optional && !v){ showError(L(answers, '이 항목은 필수 응답이에요.', 'This question is required.')); return; }
    answers[s.id] = v;
  } else if(s.type === 'number'){
    const v = document.getElementById('inp').value.trim();
    if(!v){ showError(L(answers, '숫자를 입력해주세요.', 'Please enter a number.')); return; }
    answers[s.id] = v;
  } else if(s.type === 'single'){
    if(opts && opts.some(isOtherVal) && isOtherVal(answers[s.id])){
      const v = document.getElementById('otherInput').value.trim();
      if(!v){ showError(L(answers, '기타 내용을 입력해주세요.', 'Please specify.')); return; }
      answers[s.id+'_other'] = v;
    }
  } else if(s.type === 'multi'){
    if(!answers[s.id] || answers[s.id].length === 0){ showError(L(answers, '최소 1개 이상 선택해주세요.', 'Please select at least one option.')); return; }
    if(opts && opts.some(isOtherVal) && answers[s.id].some(isOtherVal)){
      const v = document.getElementById('otherInput').value.trim();
      if(!v){ showError(L(answers, '기타 내용을 입력해주세요.', 'Please specify.')); return; }
      answers[s.id+'_other'] = v;
    }
  }
  goNext();
}

function showError(msg){
  document.getElementById('errBox').innerHTML = `<p class="error-msg">${msg}</p>`;
}

function goNext(){ cursor++; render(); }
function goBack(){ if(cursor>0){ cursor--; render(); } }

function updateProgress(){
  const pct = path.length ? Math.round((cursor / path.length) * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = pct + '%';
}

function renderDone(){
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('progressLabel').textContent = '100%';
  let footer = document.querySelector('footer.nav');
  if(footer) footer.remove();
  document.getElementById('main').innerHTML = `
    <div class="done-screen">
      <div class="icon">🐾</div>
      <h1>${L(answers,'설문을 마쳤습니다.','You\'ve completed the survey.')}</h1>
      <p>${L(answers,'응답해주셔서 감사합니다. 아래 버튼을 눌러 제출을 완료해주세요.','Thank you for your responses. Click the button below to submit.')}</p>
      <div id="submitArea" style="margin-top:24px;">
        <button class="nav-btn forward" id="submitBtn" style="width:100%;">${L(answers,'응답 제출하기','Submit responses')}</button>
      </div>
      <div id="errBox"></div>
    </div>`;
  document.getElementById('submitBtn').addEventListener('click', submitSurvey);
}

/* ============ FIXED SHEET SCHEMA ============ */
// [sheetColumnName, internalAnswerKey] — every submission writes ALL of these columns,
// in this exact order, filling '' for whatever the respondent's group skipped.

  ['submitted_at', '__submitted_at'],
  ['lang', '__lang'],
  ['route_group', '__group'],

  ['s1_nationality','nationality'], ['s1_age','age'],
  ['s1_household','household'], ['s1_household_other','household_other'],
  ['s1_housing','housing'], ['s1_housing_other','housing_other'],

  ['s2_route_current','route_current'], ['s2_route_past','route_past'],

  ['s3_pet_type','pet_type'], ['s3_pet_type_other','pet_type_other'],
  ['s3_pet_count','pet_count'],
  ['s3_acquire','acquire'], ['s3_acquire_other','acquire_other'],
  ['s3_factors','factors'], ['s3_factors_other','factors_other'],
  ['s3_reason','reason'],

  ['s3_process_regret','process_regret'],
  ['s3_care_hard','care_hard'],

];

function flattenValue(v){
  if(v === undefined || v === null) return '';
  if(Array.isArray(v)) return v.join(', ');
  if(typeof v === 'object') return Object.entries(v).map(([t,n])=>`${t}: ${n}`).join(', ');
  return v;
}

function buildFixedPayload(){
  const out = {};
  answers.__submitted_at = new Date().toISOString();
  answers.__lang = isEN(answers) ? 'EN' : 'KO';
  SHEET_COLUMNS.forEach(([col, key])=>{
    out[col] = flattenValue(answers[key]);
  });
  return out;
}

async function submitSurvey(){
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = L(answers,'제출 중...','Submitting...');
  const payload = buildFixedPayload();
  try{
    if(SUBMIT_URL.startsWith('PASTE_')){
      throw new Error(L(answers,'SUBMIT_URL 미설정','SUBMIT_URL not set'));
    }
    await fetch(SUBMIT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    });
    document.getElementById('main').innerHTML = `
      <div class="done-screen">
        <div class="icon">✅</div>
        <h1>${L(answers,'제출 완료','Submitted')}</h1>
        <p>${L(answers,'소중한 응답 감사합니다!','Thank you for your response!')}</p>
      </div>`;
  }catch(e){
    document.getElementById('errBox').innerHTML = `<p class="error-msg">${L(answers,'제출 URL이 아직 설정되지 않았어요. 개발자에게 문의해주세요.','The submit URL hasn\'t been set up yet. Please contact the developer.')} (${e.message})</p>`;
    btn.disabled = false;
    btn.textContent = L(answers,'응답 제출하기','Submit responses');
  }
}

function escapeHtml(str){ return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(str){ return escapeHtml(str); }

render();
</script>
